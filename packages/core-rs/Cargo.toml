[package]
name = "tarbo-table-core-rs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "High-performance core engine (filter, sort, pagination) for tarbo-table, compiled to WebAssembly."

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
wasm = ["dep:wasm-bindgen", "dep:js-sys", "dep:serde", "dep:serde_json"]
image = ["dep:image", "dep:blurhash"]
image-wasm = ["image", "dep:wasm-bindgen", "dep:js-sys"]

[dependencies]
wasm-bindgen = { version = "0.2.99", optional = true }
js-sys = { version = "0.3.76", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
image = { version = "0.25", default-features = false, features = [
	"jpeg",
	"png",
	"webp",
], optional = true }
blurhash = { version = "0.2", optional = true }

[dev-dependencies]

[package.metadata.wasm-pack.profile.release]
wasm-opt = [
	"-O4",
	"--enable-bulk-memory",
	"--enable-mutable-globals",
	"--enable-nontrapping-float-to-int",
	"--enable-sign-ext",
	"--enable-reference-types",
	"--enable-multivalue",
]
