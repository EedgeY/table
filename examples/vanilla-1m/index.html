<!doctype html>
<html lang="ja">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>tarbo-table — vanilla 1M demo</title>
		<link rel="stylesheet" href="./src/style.css" />
	</head>
	<body>
		<header class="topbar">
			<h1>@tarbo-table/core <small>vanilla 1M demo</small></h1>
			<div class="controls">
				<label
					>Rows
					<select id="rows">
						<option value="1000">1,000</option>
						<option value="10000">10,000</option>
						<option value="100000" selected>100,000</option>
						<option value="500000">500,000</option>
						<option value="1000000">1,000,000</option>
					</select>
				</label>
				<button id="clear-sort" type="button">Clear sort</button>
				<button id="clear-filter" type="button">Clear filter</button>
				<span class="hint"
					>ヘッダ Shift+クリック で multi-sort / 列右端ドラッグでリサイズ / 行クリックで選択</span
				>
				<span class="perf" id="perf"></span>
			</div>
		</header>
		<main id="grid"></main>
		<footer class="statusbar" id="status"></footer>
		<script type="module" src="./src/main.ts"></script>
	</body>
</html>
